[project]
name = "artmirror"
version = "0.1.0"
description = "画镜 ArtMirror — ComfyUI 图片/提示词资产管理工具"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "send2trash>=1.8",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artmirror"]

[tool.uv]
# 默认 package 模式：uv sync 会以 src layout editable 安装 artmirror，
# 双启动器与测试均直接 import artmirror 真源。

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "comfyui-plugin"]
