<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置 · 画镜 ArtMirror</title>
  <!-- 提前设置主题，避免刷新时亮/暗色闪烁 -->
  <script>
    try { document.documentElement.setAttribute("data-theme", localStorage.getItem("am-theme") || "light"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
  <script src="mock-data.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div class="sticky-head"><div id="topnav"></div></div>

<div class="page" x-data="Settings" x-init="init()">
  <h2 style="margin-top:0">设置</h2>
  <div class="setup-grid">
    <!-- 图片目录（链接式实时同步） -->
    <div class="card pad">
      <h3 style="margin-top:0">图片目录</h3>
      <p class="muted">输入本地图片目录路径，点击「添加」入库并自动扫描；图片以链接方式实时同步本地增删。</p>
      <div class="btn-row">
        <input type="text" x-model="newRoot" placeholder="/path/to/comfyui/outputs" @keydown.enter="addRootManual()" style="flex:1" />
        <button class="btn primary" @click="addRootManual()">添加</button>
      </div>
      <div class="btn-row mt">
        <button class="btn" @click="scan()" :disabled="scanning">立即重新扫描</button>
      </div>
      <div class="progress" x-show="scanning"><i :style="'width:'+progress+'%'"></i></div>
      <div class="muted mt" x-show="scanning" x-text="'进度：' + progress + '%'"></div>
      <div class="muted mt" x-show="doneMsg" style="color:var(--special)" x-text="doneMsg"></div>

      <!-- 已注册路径列表（可删除） -->
      <div class="mt" x-show="cfg.scanRoots.length">
        <div class="muted" style="font-size:12px;font-weight:600">已注册的图片目录</div>
        <template x-for="(r,i) in cfg.scanRoots" :key="r">
          <div class="root-row">
            <span class="root-path" x-text="r" :title="r"></span>
            <button class="icon-btn" title="移除该目录" @click.stop="removeRootPath(r)">×</button>
          </div>
        </template>
      </div>

      <!-- 已扫描的文件夹（隐藏 0 条图片项） -->
      <div class="mt" x-show="scannedFilters().length">
        <div class="muted" style="font-size:12px;font-weight:600">已扫描的文件夹</div>
        <div class="chips">
          <template x-for="f in scannedFilters()" :key="f.id">
            <span class="chip folder-hide" :class="{'dim': f.hidden}" :title="f.hidden ? '已隐藏，点击恢复' : '点击隐藏该文件夹'"
                  @click="toggleHide(f)"><span x-text="f.name + ' (' + f.count + ')'"></span></span>
          </template>
        </div>
      </div>
      <div class="muted mt" x-show="!cfg.scanRoots.length" style="color:var(--text-3)">尚未添加图片目录。</div>
    </div>

    <!-- 大模型配置（按角色混搭厂商） -->
    <div class="card pad">
      <h3 style="margin-top:0">大模型（OpenAI 兼容 · 混搭）</h3>
      <p class="muted">文本 / 视觉 / Embedding 各角色可分别选择不同厂商、独立配置，自由混搭。</p>
      <template x-for="r in roles" :key="r.key">
        <div style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <b x-text="r.label"></b>
            <select x-model="cfg.llm[r.key].vendor" @change="applyVendor(r.key)" style="width:auto">
              <option value="deepseek">DeepSeek</option>
              <option value="qwen">通义千问 Qwen</option>
              <option value="glm">智谱 GLM</option>
              <option value="openai">OpenAI</option>
              <option value="custom">自定义</option>
            </select>
          </div>
          <div class="muted" style="font-size:12px;margin-bottom:8px" x-text="r.desc"></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <label class="field" style="margin:0">
              <span>Base URL</span>
              <input type="text" x-model="cfg.llm[r.key].baseUrl" placeholder="https://…/v1" style="font-size:12px" />
            </label>
            <label class="field" style="margin:0">
              <span>API Key</span>
              <input type="password" x-model="cfg.llm[r.key].apiKey" placeholder="sk-…" style="font-size:12px" />
            </label>
          </div>
          <label class="field mt" style="margin:0" >
            <span x-text="r.modelLabel"></span>
            <input type="text" x-model="cfg.llm[r.key].model" placeholder="model-name" />
          </label>
        </div>
      </template>
      <div class="btn-row">
        <button class="btn primary" @click="save()">保存</button>
        <button class="btn" @click="testLLM()" :disabled="testing" x-text="testing?'测试中…':'测试连接'"></button>
      </div>
      <div class="muted mt" x-show="llmMsg" style="color:var(--special)" x-text="llmMsg"></div>
    </div>

    <!-- 批量 AI 操作 -->
    <div class="card pad">
      <h3 style="margin-top:0">批量 AI 操作</h3>
      <p class="muted">对「全部图片」或「当前筛选结果」执行批量增强。</p>
      <div class="chips" style="margin-top:6px">
        <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" x-model="scope" value="all" />全部</label>
        <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" x-model="scope" value="filter" />当前筛选</label>
      </div>
      <div class="btn-row mt">
        <button class="btn" @click="batch('reverse')">反推提示词</button>
        <button class="btn" @click="batch('translate')">中英翻译</button>
        <button class="btn" @click="batch('score')">AI 评分</button>
      </div>
      <div class="card mt" style="background:var(--bg);padding:8px 10px">
        <div class="muted" style="font-size:12px">
          · 反推结果会单独标注为「<span style="color:#833ab4">反推提示词</span>」，不覆盖原生 workflow 提示词。<br/>
          · 未配置模型时，AI 功能将置灰并给出提示。
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  var ROLES = [
    { key: "text", label: "文本模型", modelLabel: "文本模型名", desc: "用于提示词翻译 / AI 文本评分", vendor: "deepseek" },
    { key: "vision", label: "视觉模型", modelLabel: "视觉模型名", desc: "用于图片反推提示词（需支持视觉输入）", vendor: "qwen" },
    { key: "embed", label: "Embedding 模型", modelLabel: "Embedding 模型名", desc: "用于相似提示词聚类（可选）", vendor: "qwen" },
  ];
  var VENDORS = {
    deepseek: { baseUrl: "https://api.deepseek.com/v1", model: { text: "deepseek-chat", vision: "", embed: "" } },
    qwen:     { baseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1", model: { text: "qwen-plus", vision: "qwen-vl-max", embed: "text-embedding-v3" } },
    glm:      { baseUrl: "https://open.bigmodel.cn/api/paas/v4", model: { text: "glm-4-flash", vision: "glm-4v-plus", embed: "embedding-3" } },
    openai:   { baseUrl: "https://api.openai.com/v1", model: { text: "gpt-4o-mini", vision: "gpt-4o", embed: "text-embedding-3-small" } },
  };

  function blankRole(vendor) {
    return { vendor: vendor, baseUrl: "", apiKey: "", model: "" };
  }

  window.Settings = {
    roles: ROLES,
    cfg: {
      scanRoots: [],
      llm: {
        text: blankRole("deepseek"), vision: blankRole("qwen"), embed: blankRole("qwen"),
      },
    },
    scanned: [],
    newRoot: "",
    scanning: false, testing: false, progress: 0, doneMsg: "", llmMsg: "",
    scope: ["all"],
    _lastVer: -1,
    // 已扫描文件夹：过滤掉 0 条图片的项
    scannedFilters() { return (this.scanned || []).filter(function (f) { return (f.count || 0) > 0; }); },
    // 切换文件夹隐藏：置灰即图库不展示其图片
    toggleHide(f) {
      var self = this;
      Api.toggleHiddenFolder(f.id).then(function (r) {
        f.hidden = r.hidden;
        Api.listFolders().then(function (list) { self.scanned = list; });
      }).catch(function (e) {
        self.doneMsg = "隐藏失败：" + ((e && e.message) || e);
      });
    },

    init() {
      App.initNav("settings");
      var self = this;
      Api.getSettings().then(function (s) {
        self.cfg.scanRoots = s.scanRoots || [];
        var llm = s.llm || {};
        ROLES.forEach(function (r) {
          var rc = llm[r.key] || {};
          self.cfg.llm[r.key] = {
            vendor: rc.vendor || r.vendor,
            baseUrl: rc.base_url || rc.baseUrl || "",
            apiKey: rc.api_key || rc.apiKey || "",
            model: rc.model || "",
          };
        });
        self.applyVendor("vision"); self.applyVendor("embed");
      });
      Api.listFolders().then(function (f) { self.scanned = f; });
      // 轮询同步版本，本地增删后刷新已扫描文件夹
      setInterval(function () { self.pollSync(); }, 3000);
    },
    pollSync() {
      var self = this;
      Api.getSyncVersion().then(function (v) {
        if (v !== self._lastVer) { self._lastVer = v; Api.listFolders().then(function (f) { self.scanned = f; }); }
      });
    },

    // ---- 添加 / 移除图片目录 ----
    addRootManual() {
      var v = (this.newRoot || "").trim();
      if (!v) { this.doneMsg = "请输入目录路径"; return; }
      var self = this;
      this.doneMsg = "正在添加…";
      Api.addRoot(v).then(function (r) {
        self.cfg.scanRoots = r.roots || self.cfg.scanRoots;
        self.newRoot = "";
        self.doneMsg = "已添加，正在后台扫描，图库稍后自动刷新。";
        Api.listFolders().then(function (f) { self.scanned = f; });
      }).catch(function (e) {
        self.doneMsg = "添加失败：" + (e && e.message ? e.message : e);
      });
    },
    removeRootPath(path) {
      var self = this;
      if (!window.confirm("确定移除该图片目录？图库中其图片将不再链接本地。")) return;
      Api.removeRoot(path).then(function (r) {
        self.cfg.scanRoots = r.roots || [];
        self.doneMsg = "已移除，共解除 " + r.removed + " 条链接。";
        Api.listFolders().then(function (f) { self.scanned = f; });
      }).catch(function (e) {
        self.doneMsg = "移除失败：" + (e && e.message ? e.message : e);
      });
    },

    applyVendor(role) {
      var p = VENDORS[this.cfg.llm[role].vendor];
      if (!p) return;
      this.cfg.llm[role].baseUrl = p.baseUrl;
      var m = p.model[role];
      if (m) this.cfg.llm[role].model = m;
    },
    _body() {
      var llm = {};
      var self = this;
      ROLES.forEach(function (r) {
        var c = self.cfg.llm[r.key];
        llm[r.key] = { vendor: c.vendor, base_url: c.baseUrl, api_key: c.apiKey, model: c.model };
      });
      return { scanRoots: this.cfg.scanRoots, save: true, llm: llm };
    },
    save() {
      var self = this;
      Api.updateSettings(this._body()).then(function () { self.doneMsg = "已保存"; self.llmMsg = ""; });
    },
    scan() {
      var self = this;
      if (!this.cfg.scanRoots.length) { this.doneMsg = "请先添加图片目录"; return; }
      this.scanning = true; this.progress = 0; this.doneMsg = "";
      var body = this._body(); body.scan = true;
      Api.updateSettings(body).then(function (r) {
        self.scanning = false; self.progress = 100;
        var s = r.scan || {};
        self.doneMsg = "扫描完成：新增 " + s.new + "，更新 " + s.updated + "，跳过 " + s.skipped +
          "，移除 " + s.removed + "（解析 " + s.parsed + "）。" +
          (s.invalid && s.invalid.length ? " 无效目录:" + s.invalid.join(";") : "") +
          (s.errors && s.errors.length ? " 错误:" + s.errors.join(";") : "");
        Api.listFolders().then(function (f) { self.scanned = f; });
      }).catch(function (e) {
        self.scanning = false;
        self.doneMsg = "扫描失败：" + (e && e.message ? e.message : e);
      });
    },
    testLLM() {
      this.testing = true; this.llmMsg = "";
      var self = this;
      setTimeout(function () { self.testing = false; self.llmMsg = "连接成功（原型 mock）。"; }, 900);
    },
    batch(kind) { alert("原型提示：批量「" + kind + "」将在后端 M3 AI 能力接入后执行。"); },
  };
</script>
</body>
</html>
