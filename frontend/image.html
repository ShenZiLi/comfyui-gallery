<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片详情 · 画镜 ArtMirror</title>
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <!-- 提前设置主题，避免刷新时亮/暗色闪烁 -->
  <script>
    try { document.documentElement.setAttribute("data-theme", localStorage.getItem("am-theme") || "light"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="themes.css" />
  <script src="mock-data.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script defer src="vendor/alpine.min.js"></script>
</head>
<body>
<div id="topnav"></div>

<div class="page" x-data="Detail" x-init="init()" x-show="im">
  <!-- 左右空白区域翻页：仅宽屏有侧边留白时显示，悬停浮现圆形毛玻璃钮，不遮盖图片 -->
  <div class="nav-zone prev" x-cloak x-show="canPrev()" @click="goPrev()" title="上一张">
    <span class="nav-btn"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
  </div>
  <div class="nav-zone next" x-cloak x-show="canNext()" @click="goNext()" title="下一张">
    <span class="nav-btn"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
  </div>
  <!-- 放大镜（4 倍）：跟随鼠标，放大图片细节 -->
  <div class="magnifier" aria-hidden="true"></div>
  <div class="detail-layout" :class="ratioClass()">
    <!-- 大图：用原图展示以保证清晰度（信息栏置顶） -->
    <div class="detail-image card">
      <div class="pad" style="padding:8px 12px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span x-text="im.name" :data-tip="im.absPath || im.path" @click="copy(im.absPath || im.path)"
                style="font-weight:600;font-size:13px;cursor:pointer;user-select:none"></span>
          <span class="muted" x-text="fmt(im)" style="font-size:12px"></span>
          <button class="btn sm" @click="compress()" :disabled="compressing">
            <span x-text="compressing ? '压缩中…' : '压缩'"></span>
          </button>
          <div style="margin-left:auto;display:flex;align-items:center;gap:4px">
            <button class="icon-btn" :class="{active: magnify}" data-tip="放大镜 / 双击图片预览" @click="toggleMagnify()">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            </button>
            <button class="icon-btn" data-tip="复制图片" @click="copyImage()">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
            <button class="icon-btn" data-tip="下载" @click="download()">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
            </button>
            <button class="icon-btn danger" data-tip="删除" @click="reqDelete()">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
            <a class="btn sm" @click="goGallery()">返回图库</a>
          </div>
        </div>
      </div>
      <div style="position:relative" :class="{loupe-cursor: magnify}" @mousemove="magnifyMove($event)" @mouseenter="magnifyShow()" @mouseleave="magnifyHide()" @click="magnifyClick()" @dblclick="openPreview()">
        <img :src="'api/images/'+im.id+'/file'" :alt="im.name" :width="im.width" :height="im.height" />
      </div>
    </div>

    <!-- 信息栏 -->
    <div>
      <!-- 提示词（原生 / 反推 / AI） -->
      <div class="card section pad">
        <h3>提示词
          <span class="src-tabs" style="margin-left:8px">
            <button class="src-tab origin" :class="{active: im._src==='origin', has: !promptGrey('origin')}"
                    @click="selectPrompt('origin')">原生</button>
            <button class="src-tab reverse" :class="{active: im._src==='reverse', has: !!im.reversePrompt || pState==='rev'}"
                    @click="selectPrompt('reverse')">
              <span x-text="pState==='rev' ? '反推中' : '反推'"></span>
            </button>
            <button class="src-tab ai" :class="{has: attrTags().length}" @click.stop="autoTag()" data-tip="生成标签">
              <span x-text="tagging ? '生成中…' : 'AI'"></span>
            </button>
          </span>
          <span style="margin-left:auto;display:flex;gap:6px">
            <button class="btn sm" @click="toggleEdit()" x-show="editBtnVisible()" :class="{primary:editing}">
              <span x-text="editing ? '保存' : '编辑'"></span>
            </button>
            <button class="btn sm" @click="translatePrompt()" x-show="activePrompt() && !editing" :disabled="trIng">
              <span x-show="trIng">翻译中…</span>
              <span x-show="!trIng" x-text="trLabel()"></span>
            </button>
          </span>
        </h3>
        <div class="muted" style="font-size:12px" x-show="pErr"><b x-text="pErr"></b></div>
        <!-- 编辑模式：可编辑当前源的提示词/译文 -->
        <div x-show="editing" x-cloak>
          <textarea class="edit-prompt" x-model="editText" rows="6"
                    @keydown.escape.window="cancelEdit()" @keydown.meta.enter="saveEdit()"></textarea>
          <div class="muted mt" style="font-size:11px">多段提示词用空行分隔；Ctrl/⌘+Enter 保存，Esc 取消。</div>
        </div>
        <div x-show="!editing" style="color:var(--text-2)">
          <template x-for="(txt, pi) in activePrompts()" :key="pi">
            <div class="prompt-item prompt-clickable" :class="{'first':pi===0}" @click.stop="copy(txt)" x-text="txt"></div>
          </template>
          <span x-show="!activePrompts().length && pState==='parse'" style="color:var(--text-3)">AI 解析中…</span>
          <span x-show="!activePrompts().length && pState==='rev'" style="color:var(--text-3)">AI 反推中…</span>
          <span x-show="!activePrompts().length && !pState" style="color:var(--text-3)">（无提示词）</span>
        </div>
        <div class="muted mt" x-show="activeNegative()" style="font-size:12px">
          <b>负向：</b><span class="prompt-clickable" @click.stop="copy(activeNegative())" x-text="activeNegative()"></span>
        </div>
        <!-- 属性标签：双击删除 / ＋ 内联新增 -->
        <div class="attr-tags mt">
          <span class="attr-label">标签</span>
          <template x-for="t in attrTags()" :key="'t'+t.name">
            <span class="chip attr" data-tip="双击删除">
              <span class="attr-name" @dblclick.stop="removeTag(t)" x-text="t.name"></span>
            </span>
          </template>
          <button class="chip attr add" x-show="!addingTag" data-tip="新增标签" @click.stop="startAddTag()">＋</button>
          <input x-show="addingTag" x-ref="tagAddInput" class="tag-add-input" x-model="newTagText"
                 placeholder="输入标签，回车确认"
                 @keydown.enter.prevent="commitAddTag()" @keydown.esc.stop="cancelAddTag()"
                 @blur="commitAddTag()" @click.stop />
        </div>
      </div>

      <!-- 模型 / 参数 -->
      <div class="card section pad">
        <h3>模型
          <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
            <button class="btn sm" @click="preview()">预览工作流</button>
            <button class="btn sm" :class="{spin:mState==='ing'}" @click="reparseModels()"
                    x-text="mState==='ing' ? '解析中' : 'AI解析'"
                    data-tip="模型不准确时，可用AI重新解析工作流" data-tip-delay="1500"></button>
          </span>
        </h3>
        <div class="muted" style="font-size:12px" x-show="mErr"><b x-text="mErr"></b></div>
        <div class="chips" style="margin-top:6px">
          <template x-for="t in modelTags()" :key="t.category+t.name">
            <span class="chip" :class="t.category"><span x-text="t.name"></span><template x-if="t.category==='lora'"><span class="lora-w" x-text="loraStrength(t.name)"></span></template></span>
          </template>
        </div>
        <div class="muted mt" style="font-size:12px" x-show="im.params">
          steps <b x-text="im.params.steps"></b> · cfg <b x-text="im.params.cfg"></b> ·
          <b x-text="im.params.sampler"></b> · <b x-text="im.params.scheduler"></b> · seed <b x-text="im.params.seed"></b>
        </div>
      </div>

      <!-- 评分 -->
      <div class="card section pad">
        <h3>评分</h3>
        <div style="display:flex;align-items:center;gap:32px;flex-wrap:wrap">
          <div>
            <div class="muted" style="font-size:12px">人工评分</div>
            <div @mouseleave="hoverRating=0">
              <template x-for="n in 5" :key="n">
                <span class="star" :class="{off:(hoverRating? n>hoverRating : n>Math.round(im.rating||0))}"
                      style="font-size:20px"
                      @mouseenter="hoverRating=n" @click="setRating(n)">★</span>
              </template>
              <span class="star-tip" x-text="hoverRating ? (hoverRating+' 分') : (im.rating ? im.rating+' 分' : '未评分')"></span>
            </div>
          </div>
          <div>
            <div class="muted" style="font-size:12px">AI 评分</div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:20px;font-weight:700" :style="{color: im.aiRating!=null ? 'var(--brand)' : 'var(--text-3)'}" x-text="im.aiRating!=null ? im.aiRating : '—'"></span>
              <button class="icon-btn" data-tip="用 AI 重新评分" :class="{spin:aState==='ing'}" @click="aiScore()">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="card mt" style="background:var(--bg);padding:8px 10px" x-show="im.aiReason">
          <div class="muted" style="font-size:12px;white-space:pre-wrap"><b>AI 依据：</b><span x-text="im.aiReason"></span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 图片预览弹窗（双击大图触发）：拖拽平移 / 滚轮缩放 / 右上角关闭 -->
  <div class="pv" :class="{open: previewOpen}" x-cloak @keydown.escape.window="closePreview()">
    <div class="pv-mask" @click="closePreview()"></div>
    <div class="pv-window">
      <button class="pv-close" @click="closePreview()" aria-label="关闭预览" title="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="pv-stage" :class="{'pv-drag': pvDragging}"
           @pointerdown="pvDown($event)" @pointermove="pvMove($event)" @pointerup="pvUp($event)" @pointercancel="pvUp($event)"
           @wheel.prevent="pvWheel($event)" @dblclick="closePreview()" @touch-action.passive="true">
        <img :src="'api/images/'+curId+'/file'" :alt="(im && im.name) || ''" draggable="false" :style="pvStyle()" />
      </div>
    </div>
  </div>

  <!-- 删除二次确认弹窗 -->
  <div class="modal-mask" x-show="delTarget" x-cloak @keydown.escape.window="delTarget=null">
    <div class="modal" style="max-width:400px">
      <div class="modal-head">
        <h3>删除确认</h3>
        <button class="modal-x" @click="delTarget=null">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin:0 0 16px;color:var(--text-2)">确定要删除图片 <b x-text="delTarget && delTarget.name"></b> 吗？原文件将移入系统废纸篓，可从废纸篓中恢复。</p>
        <div style="display:flex;justify-content:flex-end;gap:8px">
          <button class="btn sm" @click="delTarget=null">取消</button>
          <button class="btn sm danger" @click="confirmDelete()">删除</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 工作流预览 Modal -->
  <div class="modal-mask" x-show="showModal" @keydown.escape.window="showModal=false">
    <div class="modal">
      <div class="modal-head">
        <h3>工作流预览</h3>
        <button class="modal-x" @click="showModal=false">&times;</button>
      </div>
      <div class="modal-body">
        <div class="btn-row mb">
          <button class="btn sm" @click="copy(workflowJSON())">复制</button>
          <button class="btn sm" @click="exportWorkflow()">导出</button>
        </div>
        <pre class="code" x-text="workflowJSON()"></pre>
      </div>
    </div>
  </div>
</div>

<script>
  window.Detail = {
    im: null, showModal: false, aState: "", mState: "", mErr: "", hoverRating: 0,
    delTarget: null,
    pState: "", pErr: "", trOn: false, trSrc: "", trTexts: [],
    trIng: false, trLang: "",
    compressing: false,
    editing: false, editText: "", _editWhat: "", savingEdit: false,
    addingTag: false, newTagText: "",
    tagging: false,
    navIds: [], navIdx: -1, curId: null,
    magnify: false,
    previewOpen: false, pvScale: 1, pvX: 0, pvY: 0,
    pvDragging: false, pvSX: 0, pvSY: 0, pvBX: 0, pvBY: 0,
    init() {
      App.initNav("");
      var id = new URLSearchParams(location.search).get("id");
      // 读取图库传入的浏览顺序（图库 open 时写入 am_nav），用于左右翻页
      try {
        var nav = JSON.parse(sessionStorage.getItem("am_nav") || "null");
        if (nav && Array.isArray(nav.ids) && nav.ids.length) {
          this.navIds = nav.ids.map(function (x) { return Number(x); });
          this.navIdx = this.navIds.indexOf(Number(id));
        }
      } catch (e) {}
      this._load(id);
    },
    // 加载指定图片：更新视图与 URL（replaceState 让刷新/前进后退不丢上下文）
    _load(id, dir) {
      var self = this;
      this.curId = Number(id);
      this.navIdx = this.navIds.indexOf(this.curId);
      if (Number(new URLSearchParams(location.search).get("id")) !== this.curId) {
        history.replaceState(null, "", "?id=" + this.curId);
      }
      // 切图后清空瞬态交互状态
      this.aState = ""; this.mState = ""; this.mErr = ""; this.hoverRating = 0;
      this.pState = ""; this.pErr = ""; this.trOn = false; this.trSrc = ""; this.trTexts = []; this.trIng = false;
      this.compressing = false;
      this.addingTag = false; this.newTagText = "";
      this.tagging = false;
      this.delTarget = null; this.showModal = false;
      Api.getImage(id).then(function (image) {
        self.im = image;
        image._src = (image.prompt && image.prompt !== "") ? "origin" : "reverse";
        // 翻页动效（方案 D·滑动景深）：等 Alpine 渲染完新图再播放，避免旧内容被动画闪到
        if (dir === 1 || dir === -1) {
          var p = document.querySelector(".detail-layout");
          if (p) {
            p.classList.remove("am-pg-left", "am-pg-right");
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                if (dir === -1) p.classList.add("am-pg-left");
                else p.classList.add("am-pg-right");
              });
            });
          }
        }
      });
    },
    // 左右翻页：左=上一张（右→左滑动），右=下一张（左→右滑动）；到边界给出提示
    goPrev() {
      var i = this.navIds.indexOf(this.curId);
      if (i <= 0) { App.toast("已是第一张"); return; }
      this._load(this.navIds[i - 1], -1);
    },
    goNext() {
      var i = this.navIds.indexOf(this.curId);
      if (i < 0 || i >= this.navIds.length - 1) { App.toast("已是最后一张"); return; }
      this._load(this.navIds[i + 1], 1);
    },
    canPrev() { return this.navIds.length > 0 && this.navIds.indexOf(this.curId) > 0; },
    canNext() { return this.navIds.length > 0 && this.navIds.indexOf(this.curId) >= 0 && this.navIds.indexOf(this.curId) < this.navIds.length - 1; },
    fmt(im) { return im.width + "×" + im.height + " · " + App.fmtSize(im.fileSize); },
    // 按名匹配返回 lora 权重文本（来自后端 card.loras；未持久化时为空）
    loraStrength(name) {
      var loras = (this.im && this.im.loras) || [];
      for (var i = 0; i < loras.length; i++) {
        if (loras[i].name === name) {
          var s = Number(loras[i].strength);
          if (s === 0) return "";
          return " · " + (Math.round(s * 100) / 100);
        }
      }
      return "";
    },
    // 属性标签
    attrTags() { return ((this.im && this.im.tags) || []).filter(function (t) { return t.category === 'attr'; }); },
    // 模型板块标签：排除属性标签（属性标签在提示词板块展示/编辑），保留模型/LoRA/VAE 等资源标签
    modelTags() { return ((this.im && this.im.tags) || []).filter(function (t) { return t.category !== 'attr'; }); },
    _refreshTags(tags) {
      var cur = (this.im && this.im.tags) || [];
      this.im.tags = cur.filter(function (t) { return t.category !== 'attr'; }).concat(tags || []);
    },
    // 内联新增：点 ＋ 在标签右侧弹出迷你输入框，回车确认、Esc/点空白取消
    startAddTag() {
      var self = this;
      this.addingTag = true; this.newTagText = "";
      this.$nextTick(function () { var el = self.$refs.tagAddInput; if (el) el.focus(); });
    },
    commitAddTag() {
      if (!this.addingTag) return;
      var name = (this.newTagText || "").trim();
      this.addingTag = false; this.newTagText = "";
      if (!name) return;
      var self = this;
      Api.addImageTag(this.im.id, name).then(function (d) {
        self._refreshTags(d && d.tags);
        App.toast("已添加");
      }).catch(function (e) {
        App.toast((e && e.message) || "添加失败");
      });
    },
    cancelAddTag() { this.addingTag = false; this.newTagText = ""; },
    // AI 生成标签：用文本模型从该图提示词提取属性标签（追加合并）
    autoTag() {
      var self = this;
      if (!this.im || this.tagging) return;
      this.tagging = true;
      this.pErr = "";
      Api.autoTag(this.im.id).then(function (d) {
        self.tagging = false;
        if (d && Array.isArray(d.tags)) self._refreshTags(d.tags);
        App.toast("已生成标签");
      }).catch(function (e) {
        self.tagging = false;
        self.pErr = (e && e.message) || "生成标签失败";
        App.toast((e && e.message) || "生成标签失败");
      });
    },
    removeTag(t) {
      var self = this;
      Api.removeImageTag(this.im.id, t.name).then(function (d) {
        self._refreshTags(d && d.tags);
        App.toast("已删除");
      }).catch(function (e) {
        App.toast((e && e.message) || "删除失败");
      });
    },
    // 横纵比 >1（横图）上下布局；<=1（竖图）左右布局
    ratioClass() {
      var im = this.im; if (!im) return "portrait";
      var w = Number(im.width) || 1, h = Number(im.height) || 1;
      return (w / h) > 2.3 ? "landscape" : "portrait";
    },
    copy(text, label) { App.copyText(text); },
    copyImage() {
      var im = this.im; if (!im) return;
      fetch("api/images/" + im.id + "/file").then(function (r) { return r.blob(); }).then(function (b) {
        if (!navigator.clipboard || typeof ClipboardItem === "undefined" || window.isSecureContext === false) {
          throw new Error("unsupported");
        }
        return navigator.clipboard.write([new ClipboardItem({ "image/png": b })]);
      }).then(function () {
        App.toast("已复制");
      }).catch(function () {
        App.toast("复制失败（当前环境不支持复制图片）");
      });
    },
    download() {
      var im = this.im; if (!im) return;
      var a = document.createElement("a");
      a.href = "api/images/" + im.id + "/file";
      a.download = im.name || "image.png"; a.click();
    },
    compress() {
      var self = this;
      if (!this.im || this.compressing) return;
      this.compressing = true;
      Api.compressImage(this.im.id).then(function (r) {
        self.compressing = false;
        if (r && r.saved) {
          // 覆盖原图：立刻更新名称/大小，并强制详情大图重新加载覆盖后的 .jpg
          if (r.name) self.im.name = r.name;
          if (r.fileSize != null) self.im.fileSize = r.fileSize;
          var img = document.querySelector(".detail-image img");
          if (img) img.setAttribute("src", "api/images/" + self.im.id + "/file?v=" + Date.now());
          App.toast("压缩成功：原 " + App.fmtSize(r.original) + " → " + App.fmtSize(r.compressed));
        } else {
          App.toast((r && r.reason) || "压缩未生效");
        }
      }).catch(function (e) {
        self.compressing = false;
        App.toast("压缩失败：" + ((e && e.message) || e));
      });
    },
    // ===== 放大镜（4 倍，跟随鼠标） =====
    toggleMagnify() {
      this.magnify = !this.magnify;
      document.body.classList.toggle("am-loupe", this.magnify);
      if (!this.magnify) this.magnifyHide();
    },
    magnifyClick() {
      // 放大镜状态下点击图片：自动退出放大镜
      if (this.magnify) this.toggleMagnify();
    },
    magnifyMove(e) {
      if (!this.magnify) return;
      var img = document.querySelector(".detail-image img");
      var mag = document.querySelector(".magnifier");
      if (!img || !mag || !this.curId) return;
      var rect = img.getBoundingClientRect();
      var ux = e.clientX - rect.left, uy = e.clientY - rect.top;
      if (ux < 0 || uy < 0 || ux > rect.width || uy > rect.height) return;
      var L = (mag.offsetWidth) || 240, ZOOM = 4;
      mag.style.backgroundImage = "url('api/images/" + this.curId + "/file')";
      mag.style.backgroundSize = (rect.width * ZOOM) + "px " + (rect.height * ZOOM) + "px";
      mag.style.backgroundPosition = (L / 2 - ZOOM * ux) + "px " + (L / 2 - ZOOM * uy) + "px";
      var left = e.clientX + 26 - L / 2, top = e.clientY + 26 - L / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - L - 8));
      top = Math.max(8, Math.min(top, window.innerHeight - L - 8));
      mag.style.left = left + "px";
      mag.style.top = top + "px";
    },
    magnifyShow() {
      if (!this.magnify) return;
      var mag = document.querySelector(".magnifier");
      if (mag) mag.classList.add("on");
    },
    magnifyHide() {
      var mag = document.querySelector(".magnifier");
      if (mag) mag.classList.remove("on");
    },
    // ===== 图片预览弹窗（双击大图触发）：拖拽平移 / 滚轮缩放 =====
    openPreview() {
      this.pvScale = 1; this.pvX = 0; this.pvY = 0; this.pvDragging = false;
      this.previewOpen = true;
      document.body.classList.add("am-pv-open");
    },
    closePreview() {
      this.previewOpen = false; this.pvDragging = false;
      document.body.classList.remove("am-pv-open");
    },
    pvStyle() {
      return "transform: translate(" + this.pvX + "px, " + this.pvY + "px) scale(" + this.pvScale + ")";
    },
    pvDown(e) {
      if (e.button !== 0) return;
      this.pvDragging = true;
      this.pvSX = e.clientX; this.pvSY = e.clientY;
      this.pvBX = this.pvX; this.pvBY = this.pvY;
      if (e.currentTarget && e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
      e.preventDefault();
    },
    pvMove(e) {
      if (!this.pvDragging) return;
      this.pvX = this.pvBX + (e.clientX - this.pvSX);
      this.pvY = this.pvBY + (e.clientY - this.pvSY);
    },
    pvUp() { this.pvDragging = false; },
    pvWheel(e) {
      var d = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      this.pvScale = Math.max(1, Math.min(8, this.pvScale * d));
      if (this.pvScale === 1) { this.pvX = 0; this.pvY = 0; }
    },
    goGallery() {
      // 优先走浏览器前进/后退缓存（bfcache）返回图库：秒回、不重新加载；否则淡出后全量导航
      if (document.referrer && document.referrer.indexOf("gallery.html") >= 0) { history.back(); }
      else { App.go("gallery.html"); }
    },
    reqDelete() { if (this.im) this.delTarget = this.im; },
    confirmDelete() {
      var im = this.delTarget;
      if (!im) return;
      this.delTarget = null;
      Api.deleteImage(im.id).then(function () {
        App.toast("已删除");
        App.go("gallery.html");
      }).catch(function (e) {
        alert((e && e.message) || "删除失败");
      });
    },
    setRating(n) {
      var self = this;
      this.hoverRating = 0;
      this.im.rating = n;
      Api.setRating(this.im.id, n).then(function (card) {
        if (card && card.rating !== undefined) self.im.rating = card.rating;
      }).catch(function () { App.toast("评分保存失败"); });
    },
    // 提示词三源（原生/反推/AI）
    activePrompts() {
      var im = this.im; if (!im) return [];
      // 当前源已翻译：直接显示译文数组（切换显示，不再请求 AI）
      if (this.trOn && this.trSrc === im._src && this.trTexts.length) return this.trTexts;
      var raw;
      if (im._src === "reverse") raw = (im.reversePrompt || "") ? [im.reversePrompt] : [];
      else if (im._src === "ai") raw = (Array.isArray(im.aiPrompts) && im.aiPrompts.length) ? im.aiPrompts.slice() : ((im.aiPrompt || "") ? [im.aiPrompt] : []);
      else raw = (Array.isArray(im.originPrompts) && im.originPrompts.length) ? im.originPrompts.slice() : ((im.prompt || "") ? [im.prompt] : []);
      raw = raw.filter(function (t) { return (t || "").length >= 10; });
      raw.sort(function (a, b) { return b.length - a.length; });
      return raw;
    },
    activePrompt() { return (this.activePrompts()[0] || ""); },
    // ===== 提示词编辑 / 保存 =====
    editBtnVisible() {
      // 始终可编辑：原生为空也可进入编辑「新增提示词」
      return !!this.im;
    },
    toggleEdit() {
      if (!this.im) return;
      if (this.editing) { this.saveEdit(); return; }
      this.editing = true;
      this._editWhat = (this.trOn && this.trSrc === this.im._src && this.trTexts.length > 0) ? "translation" : this.im._src;
      // 当前源为空时，默认落回「原生」，便于为（原生无提示词的）图片新增原生提示词
      if (this._editWhat !== "translation" && this.activePrompts().length === 0) {
        this.im._src = "origin"; this._editWhat = "origin";
      }
      this.editText = this._editingSourceText();
    },
    cancelEdit() {
      if (!this.editing) return;
      this.editing = false; this.editText = ""; this._editWhat = "";
      // 恢复原文显示（若之前切到译文则回到原文）
      this.trOn = false; this.trSrc = ""; this.trTexts = [];
    },
    // 当前编辑对象对应的可编辑全文
    _editingSourceText() {
      if (this._editWhat === "translation") return (this.trTexts || []).join("\n");
      return this.activePrompts().join("\n");
    },
    saveEdit() {
      var im = this.im; var self = this;
      if (!im || this.savingEdit) return;
      var texts = String(this.editText || "").split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
      var data;
      if (this._editWhat === "translation") {
        var lang = this.trLang || "en";
        data = { target: "translation", kind: im._src, lang: lang, texts: texts };
      } else {
        data = { target: im._src, texts: texts };
      }
      this.savingEdit = true;
      Api.updatePrompt(im.id, data).then(function (card) {
        self.savingEdit = false;
        self._applyCard(card);
        self.editing = false; self.editText = ""; self._editWhat = "";
        // 编辑的是译文时，保存后继续显示该译文
        if (data.target === "translation") {
          self.trOn = true; self.trSrc = self.im._src;
          self.trTexts = texts; self.trLang = lang;
        }
        App.toast("已保存");
      }).catch(function (e) {
        self.savingEdit = false;
        App.toast("保存失败：" + ((e && e.message) || e) );
      });
    },
    _applyCard(card) {
      if (!card || !this.im) return;
      var im = this.im;
      if (card.prompt !== undefined) im.prompt = card.prompt || "";
      if (card.originPrompts !== undefined) im.originPrompts = card.originPrompts || [];
      if (card.aiPrompt !== undefined) im.aiPrompt = card.aiPrompt || "";
      if (card.aiPrompts !== undefined) im.aiPrompts = card.aiPrompts || [];
      if (card.reversePrompt !== undefined) im.reversePrompt = card.reversePrompt || "";
      if (card.translations !== undefined) im.translations = card.translations || {};
    },
    // 译文可能为多段（后端用 <<<SEG>>> 或换行分隔），切回数组逐段展示
    _splitSegs(text) {
      if (!text) return [];
      var parts = text.split("\n<<<SEG>>>\n").map(function (s) { return s.trim(); }).filter(Boolean);
      if (parts.length < 2) {
        parts = text.split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
      }
      return parts.length ? parts : [text.trim()];
    },
    // 原文按长度降序展示，译文需按同一索引重排，保证第 i 段译文对应第 i 段原文
    _alignSegs(srcRaw, trs) {
      if (!srcRaw.length || !trs.length) return trs;
      var idx = srcRaw.map(function (_, i) { return i; });
      idx.sort(function (a, b) { return srcRaw[b].length - srcRaw[a].length; });
      var out = idx.map(function (i) { return trs[i]; });
      return out.filter(function (t) { return !!t; });
    },
    // 取当前源过滤后的原序原文（用于翻译后按展示顺序对齐译文）
    _srcRawList(im, kind) {
      var raw;
      if (kind === "reverse") raw = (im.reversePrompt || "") ? [im.reversePrompt] : [];
      else if (kind === "ai") raw = (Array.isArray(im.aiPrompts) && im.aiPrompts.length) ? im.aiPrompts.slice() : ((im.aiPrompt || "") ? [im.aiPrompt] : []);
      else raw = (Array.isArray(im.originPrompts) && im.originPrompts.length) ? im.originPrompts.slice() : ((im.prompt || "") ? [im.prompt] : []);
      return raw.filter(function (t) { return (t || "").length >= 10; });
    },
    trLabel() { return (this.trOn && this.trSrc === this.im._src) ? "原文" : "中英译"; },
    translatePrompt() {
      var self = this;
      var im = this.im;
      if (!im || this.trIng) return;
      var kind = im._src;
      // 翻译前捕获原序原文，翻译后按原文展示顺序对齐译文
      var srcRaw = self._srcRawList(im, kind);
      // 已有持久化译文：直接切换显示，不再请求 AI
      var stored = (im.translations && im.translations[kind]) || {};
      var langs = Object.keys(stored);
      var lang = null;
      if (langs.length) {
        lang = langs[0];
        self.trTexts = self._alignSegs(srcRaw, self._splitSegs(stored[lang]));
        self.trSrc = kind;
        self.trLang = lang;
        self.trOn = !(self.trOn && self.trSrc === kind);
        return;
      }
      this.trIng = true; this.pErr = "";
      Api.translatePrompt(im.id, kind).then(function (d) {
        im.translations = im.translations || {};
        im.translations[kind] = im.translations[kind] || {};
        im.translations[kind][d.lang] = d.text || (d.texts || []).join("\n");
        var trs = (d && Array.isArray(d.texts)) ? d.texts : self._splitSegs(d.text || "");
        self.trTexts = self._alignSegs(srcRaw, trs);
        self.trSrc = kind; self.trOn = true; self.trLang = d.lang;
        self.trIng = false;
      }).catch(function (e) {
        self.trIng = false;
        self.pErr = (e && e.message) || "翻译失败";
      });
    },
    activeNegative() {
      if (!this.im) return "";
      if (this.im._src === "ai") return (this.im.aiNegative || "");
      if (Array.isArray(this.im.negativePrompts) && this.im.negativePrompts.length) return this.im.negativePrompts.join("\n");
      return (this.im.negative || "");
    },
    promptGrey(kind) {
      var im = this.im; if (!im) return true;
      if (kind === "origin") return !(im.prompt || "");
      if (kind === "reverse") return !(im.reversePrompt || "");
      if (kind === "ai") return !(im.aiPrompt || "");
      return false;
    },
    selectPrompt(kind) {
      var im = this.im; if (!im) return;
      // 编辑模式下切换源：仅换编辑对象，不触发 AI 解析
      if (this.editing) {
        im._src = kind; this._editWhat = kind;
        this.editText = this._editingSourceText();
        return;
      }
      // 切换提示词源时，重置译文显示（回到原文）
      this.trOn = false; this.trSrc = ""; this.trTexts = [];
      if (!this.promptGrey(kind)) { im._src = kind; return; }
      if (kind === "reverse") this.reverseGen();
      else if (kind === "ai") this.reparseModels(true);
    },
    reverseGen() {
      var self = this;
      if (this.pState === "rev") return;
      this.pState = "rev"; this.pErr = "";
      Api.reversePrompt(this.im.id).then(function (d) {
        self.pState = "";
        if (d && d.reversePrompt) self.im.reversePrompt = d.reversePrompt;
        self.im._src = "reverse";
      }).catch(function (e) {
        self.pState = "";
        self.pErr = (e && e.message) || "AI 反推失败";
      });
    },
    preview() { this.showModal = true; },
    exportWorkflow() {
      var blob = new Blob([this.workflowJSON()], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = (this.im.name || "workflow").replace(/\.png$/i, "") + "_workflow.json";
      a.click();
    },
    workflowJSON() {
      var im = this.im; if (!im) return "{}";
      if (im.workflow) { try { return JSON.stringify(JSON.parse(im.workflow), null, 2); } catch (e) { return im.workflow; } }
      return JSON.stringify({
        nodes: [{ id: 4, type: "CheckpointLoaderSimple", widgets_values: [im.params, im.tags] }],
        _meta: { title: im.name },
        prompt: im.prompt, negative: im.negative,
        model: im.tags && im.tags[0].name, sample: true,
      }, null, 2);
    },
    aiScore() {
      var self = this;
      if (this.aState === "ing") return;
      this.aState = "ing";
      Api.scoreImage(this.im.id).then(function (card) {
        self.aState = "";
        if (card && card.aiRating !== undefined) self.im.aiRating = card.aiRating;
        if (card && card.aiReason !== undefined) self.im.aiReason = card.aiReason;
      }).catch(function (e) {
        self.aState = "";
        alert((e && e.message) || "AI 评分失败");
      });
    },
    reparseModels(triggerAi) {
      var self = this;
      if (this.mState === "ing" || !this.im) return;
      this.mState = "ing"; this.mErr = ""; this.pState = "parse"; this.pErr = "";
      Api.reparseModels(this.im.id).then(function (card) {
        self.mState = ""; self.pState = "";
        if (card && card.tags) self.im.tags = card.tags;
        if (card && card.model) self.im.model = card.model;
        if (card && (card.aiPrompt !== undefined)) {
          self.im.aiPrompt = card.aiPrompt || "";
          self.im.aiNegative = card.aiNegative || "";
          self.im.aiPrompts = (Array.isArray(card.aiPrompts) && card.aiPrompts.length) ? card.aiPrompts : ((self.im.aiPrompt) ? [self.im.aiPrompt] : []);
        }
        if (triggerAi) self.im._src = "ai";
      }).catch(function (e) {
        self.mState = ""; self.pState = "";
        self.mErr = self.pErr = (e && e.message) || "AI 重解析失败";
      });
    },
  };

  // 顶层悬浮气泡：data-tip 元素悬停后把气泡挂在 body 顶层显示（避免被裁剪）
  // 延迟默认 600ms，可用 data-tip-delay 属性按元素指定（毫秒）
  (function () {
    var state = { cur: null, bubble: null, timer: null };
    function hide() {
      clearTimeout(state.timer);
      if (state.bubble && state.bubble.parentNode) state.bubble.parentNode.removeChild(state.bubble);
      state.bubble = null; state.cur = null;
    }
    document.addEventListener("mouseover", function (ev) {
      var el = ev.target && ev.target.closest ? ev.target.closest("[data-tip]") : null;
      if (!el || el === state.cur) return;
      hide();
      state.cur = el;
      var tip = el.getAttribute("data-tip") || "";
      if (!tip) return;
      var b = document.createElement("div");
      b.className = "am-tip-bubble";
      b.textContent = tip;
      document.body.appendChild(b);
      var r = el.getBoundingClientRect();
      b.style.left = (r.left + r.width / 2) + "px";
      b.style.top = (r.bottom + 8) + "px";
      b.style.transform = "translateX(-50%)";
      state.bubble = b;
      var delay = parseInt(el.getAttribute("data-tip-delay") || "600", 10) || 600;
      state.timer = setTimeout(function () { b.classList.add("show"); }, delay);
    }, true);
    document.addEventListener("mouseout", function (ev) {
      var el = state.cur;
      if (!el) return;
      if (ev.relatedTarget && el.contains(ev.relatedTarget)) return; // 仍在元素内
      hide();
    }, true);
  })();
</script>
