<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图库 · 画镜 ArtMirror</title>
  <!-- 提前设置主题并（返回时）预隐藏内容，避免首绘闪烁 -->
  <script>
    try { document.documentElement.setAttribute("data-theme", localStorage.getItem("am-theme") || "light"); } catch (e) {}
    try { if (sessionStorage.getItem("am_gallery_state")) document.documentElement.classList.add("am-restore"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
  <script src="mock-data.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div x-data="Gallery" x-init="init()">
  <!-- 顶部整体固定（满宽紧贴顶） -->
  <div class="sticky-head">
    <div id="topnav"></div>
    <div class="sticky-inner">
      <div class="toolbar">
      <button class="btn primary" @click="$refs.fileInput.click()">导入</button>
      <input type="file" webkitdirectory multiple style="display:none" x-ref="fileInput" @change="imported($event)" />

      <select x-model="currentFolder" @change="loadImages()" style="width:auto;max-width:220px">
        <option value="">全部目录</option>
        <template x-for="f in folders" :key="f.id">
          <option :value="f.id" x-text="(f.path||'根目录')+' ('+f.count+')'"></option>
        </template>
      </select>

      <div class="seg">
        <button :class="{active:mode==='flat'}" @click="mode='flat';loadImages()">平铺</button>
        <button :class="{active:mode==='immersive'}" @click="mode='immersive';loadImages()">沉浸</button>
        <button :class="{active:mode==='aggregate'}" @click="mode='aggregate';reloadGroups()">聚合</button>
      </div>

      <select x-model="sort" @change="loadImages()" style="width:auto">
        <option value="time">按时间</option>
        <option value="ai">按 AI 评分</option>
        <option value="manual">按人工评分</option>
      </select>

      <span class="nav-spacer"></span>

      <div class="searchbox">
        <input type="text" placeholder="搜索提示词 / 模型…" x-model="q"
               @keyup.debounce.300ms="loadImages()" />
      </div>
      <span class="muted" x-text="summary"></span>
    </div>

    <!-- 标签筛选 -->
    <div class="chips" x-show="allTags.length" style="margin-bottom:0">
      <span style="color:var(--text-3);font-size:12px">筛选：</span>
      <template x-for="t in allTags" :key="t.category+':'+t.name">
        <span class="chip" :class="[t.category, {active: selectedTag===t.name}]"
              @click="selectedTag = selectedTag===t.name ? null : t.name; loadImages()"
              x-text="t.name"></span>
      </template>
      <span class="chip" :class="{active: selectedTag===null}" @click="selectedTag=null;loadImages()">全部</span>
    </div>
    </div>
  </div>

  <div class="page" @dragover.prevent @drop.prevent="drop($event)">
    <div style="margin-top:12px">
    <div x-show="!loading && !images.length && (mode==='flat'||mode==='immersive')" class="empty">
      暂无图片 —— 点击左上角「导入」或前往「设置」配置图片目录。
    </div>

    <!-- 平铺：图片 + 提示词 -->
    <div class="masonry" x-show="mode==='flat' && images.length">
      <template x-for="im in images" :key="im.id">
        <div class="card img-card">
          <div class="thumb-wrap" @click="open(im.id)">
            <img :src="im.thumb" :alt="im.name" loading="lazy"
                 :style="'aspect-ratio:'+(im.width||1)+' / '+(im.height||1)" />
          </div>
          <div class="info">
            <!-- 1) 尺寸 / 大小 + 复制/下载/删除 一行 -->
            <div class="meta-row">
              <span class="muted" style="font-size:11px" x-text="im.width+'×'+im.height + ' · ' + fmtSize(im.fileSize)"></span>
              <span style="font-size:12px;color:var(--text-2);font-weight:600;margin-left:8px" x-show="im.aiRating!=null">AI <span x-text="im.aiRating"></span></span>
              <span class="nav-spacer"></span>
              <button class="icon-btn" title="复制图片" @click.stop="copyImage(im)">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
              </button>
              <button class="icon-btn" title="下载" @click.stop="download(im)">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
              </button>
              <button class="icon-btn danger" title="删除" @click.stop="reqDelete(im)">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>
              </button>
            </div>

            <!-- 2) 模型（主模型 / LoRA） + 刷新 -->
            <div style="margin-top:8px">
              <div style="display:flex;align-items:center;gap:6px">
                <span style="font-size:12px;color:var(--text-3)">模型</span>
                <span class="nav-spacer"></span>
                <button class="src-tab ai" :class="{'ai-ing':isReparsing(im)}" title="用 AI 解析模型与提示词"
                        @click.stop="reparseAll(im)">
                  <span x-text="isReparsing(im) ? '解析中' : 'AI'"></span>
                </button>
              </div>
              <div class="chips" x-show="modelChips(im).length" style="margin-top:6px">
                <template x-for="t in modelChips(im)" :key="t.category+t.name">
                  <span class="chip" :class="t.category" x-text="t.name"></span>
                </template>
              </div>
              <div class="muted" style="font-size:11px;margin-top:6px" x-show="!modelChips(im).length">
                <span x-text="isReparsing(im) ? 'AI 解析中…' : '未识别到模型'" x-show="!im._mErr"></span>
                <span x-show="im._mErr" x-text="im._mErr"></span>
                <span x-show="!im._mErr && !isReparsing(im) && !modelChips(im).length" style="display:inline">—— 点右上角 AI 解析</span>
              </div>
            </div>

            <!-- 3) 提示词（原生 / 反推 / AI） -->
            <div style="margin-top:8px">
              <div class="prompt-header">
                <span style="display:inline-flex;align-items:center;gap:6px">
                  <span style="font-size:12px;color:var(--text-3)">提示词</span>
                  <span class="src-tabs">
                    <button class="src-tab origin" :class="{active: im._src==='origin', dim: promptGrey(im,'origin')}"
                            @click.stop="selectPrompt(im,'origin')">原生</button>
                    <button class="src-tab reverse" :class="{active: im._src==='reverse', dim: promptGrey(im,'reverse')&&!im._rParse}"
                            @click.stop="selectPrompt(im,'reverse')">
                      <span x-text="im._rParse ? '反推中' : '反推'"></span>
                    </button>
                    <button class="src-tab ai" :class="{active: im._src==='ai', 'ai-has': !!im.aiPrompt, dim: !im.aiPrompt && !isReparsing(im)}"
                            @click.stop="selectPrompt(im,'ai')">
                      <span x-text="isReparsing(im) ? '解析中' : 'AI'"></span>
                    </button>
                  </span>
                </span>
                <span style="display:inline-flex;align-items:center;gap:2px">
                  <button class="icon-btn" title="展开/收起" x-show="promptMore(im)"
                          @click.stop="im._exp=!im._exp">
                    <svg x-show="!im._exp" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg>
                    <svg x-show="im._exp" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14l-5-5-5 5"/></svg>
                  </button>
                  <button class="icon-btn" title="复制提示词" @click.stop="copy(activePrompts(im)[0] || '')">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                  </button>
                  <button class="icon-btn" title="预览工作流" @click.stop="previewWorkflow(im)">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M5 12l4-4M5 12l4 4M19 12l-4-4M19 12l-4 4"/></svg>
                  </button>
                </span>
              </div>
              <div class="prompt-box" :class="{expanded:im._exp}"
                   x-ref="pb" :id="'pb-'+im.id" x-show="activePrompts(im).length || isReparsing(im) || im._rParse"
                   @click="im._exp=!im._exp">
                <template x-for="(txt, pi) in activePrompts(im)" :key="pi">
                  <div class="prompt-item" :class="{'first':pi===0}" x-html="mark(txt)"></div>
                </template>
                <span x-show="isReparsing(im) && !activePrompts(im).length" style="color:var(--text-3)">AI 解析中…</span>
                <span x-show="im._rParse && !activePrompts(im).length" style="color:var(--text-3)">AI 反推中…</span>
              </div>
              <div class="muted" style="font-size:11px;margin-top:4px" x-show="promptErr(im)">
                <span x-text="promptErr(im)"></span>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- 沉浸：纯图片，保留原始宽高比 -->
    <div class="masonry immersive" x-show="mode==='immersive' && images.length">
      <template x-for="im in images" :key="im.id">
        <div class="card img-card immersive-cell" @click="open(im.id)" title="点击查看详情">
          <div class="thumb-wrap"><img :src="im.thumb" :alt="im.name" loading="lazy" /></div>
        </div>
      </template>
    </div>

    <!-- 聚合 -->
    <div x-show="mode==='aggregate'" x-cloak>
      <div class="muted mb" style="display:flex;align-items:center;gap:8px">
        按相同提示词聚合：<b x-text="groupCount"></b> 组
      </div>
      <div class="group-grid" x-show="visibleGroups().length">
        <template x-for="g in visibleGroups()" :key="g.id">
          <div class="card group-card">
            <div class="cover-row">
              <template x-for="m in g.members.slice(0,6)" :key="m.id">
                <img :src="m.thumb" @click="open(m.id)" :title="m.name" />
              </template>
            </div>
            <div class="g-title">
              <h4><span x-html="mark(g.title)"></span></h4>
            </div>
            <div class="g-body">
              <div class="muted" style="display:flex;justify-content:space-between;font-size:12px">
                <span x-text="g.count+' 张图片'"></span>
                <span x-text="'最高 AI '+g.maxScore"></span>
              </div>
              <button class="btn sm mt" @click="g._open=!g._open" x-text="g._open?'收起':'展开成员'"></button>
              <div class="member-grid" x-show="g._open">
                <template x-for="m in g.members" :key="m.id">
                  <div>
                    <img :src="m.thumb" @click="open(m.id)" :title="m.name" />
                    <div style="text-align:center;font-size:11px;color:var(--text-3)" x-text="m.aiRating!=null?'AI '+m.aiRating:'未评分'"></div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
      <div class="empty" x-show="!visibleGroups().length">没有符合条件的提示词组。</div>
    </div>
  </div>

  <!-- 工作流预览弹窗 -->
  <div class="modal-mask" x-show="showWorkflow" @keydown.escape.window="showWorkflow=false">
    <div class="modal">
      <div class="modal-head">
        <h3>工作流预览</h3>
        <button class="modal-x" @click="showWorkflow=false">&times;</button>
      </div>
      <div class="modal-body">
        <div class="btn-row mb">
          <button class="btn sm" @click="copy(workflowJSON())">复制</button>
          <button class="btn sm" @click="exportWorkflow()">导出</button>
        </div>
        <pre class="code" x-text="workflowJSON()"></pre>
      </div>
    </div>
  </div>

  <!-- 删除二次确认弹窗 -->
  <div class="modal-mask" x-show="delTarget" @keydown.escape.window="delTarget=null">
    <div class="modal" style="max-width:400px">
      <div class="modal-head">
        <h3>删除确认</h3>
        <button class="modal-x" @click="delTarget=null">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin:0 0 16px;color:var(--text-2)">确定要删除图片 <b x-text="delTarget && delTarget.name"></b> 吗？此操作会从图库中移除，不可恢复。</p>
        <div style="display:flex;justify-content:flex-end;gap:8px">
          <button class="btn sm" @click="delTarget=null">取消</button>
          <button class="btn sm danger" @click="confirmDelete()">删除</button>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
  window.Gallery = {
    folders: [], images: [], groups: [], tags: [], q: "", mode: "flat", currentFolder: "",
    selectedTag: null, sort: "time", loading: true, summary: "", showWorkflow: false, wfText: "",
    delTarget: null, _ver: -1, _restoreScroll: 0,
    init() {
      App.initNav("gallery");
      var self = this;
      // 从详情页返回时恢复视图状态与滚动位置
      var saved = null;
      try { saved = JSON.parse(sessionStorage.getItem("am_gallery_state") || "null"); sessionStorage.removeItem("am_gallery_state"); } catch (e) {}
      if (saved) {
        // 关闭浏览器原生返回时的自动滚动恢复，改由我们精确控制位置
        if (history.scrollRestoration) history.scrollRestoration = "manual";
        // 恢复期间隐藏内容（保留布局/滚动），定位后再一次性显示，避免顶部闪烁
        document.documentElement.classList.add("am-restore");
        self.mode = saved.mode || "flat";
        self.currentFolder = saved.folder || "";
        self.sort = saved.sort || "time";
        self.q = saved.q || "";
        self.selectedTag = saved.tag || null;
        var savedY = saved.scroll || 0;
        self._restoreScroll = savedY;
        // 兜底：若干秒后若仍未完成定位，确保内容可见并尽量回到目标位置
        window.setTimeout(function () {
          if (document.documentElement.classList.contains("am-restore")) {
            window.scrollTo(0, savedY);
            document.documentElement.classList.remove("am-restore");
          }
        }, 2000);
        // 浏览器「后退」bfcache 返回时重新定位并显示
        window.addEventListener("pageshow", function (ev) {
          if (ev.persisted) {
            if (history.scrollRestoration) history.scrollRestoration = "manual";
            window.scrollTo(0, savedY);
            document.documentElement.classList.remove("am-restore");
          }
        });
      }
      Api.listFolders().then(f => { self.folders = f; });
      Api.listTags().then(t => { self.tags = t; });
      this.loadImages();
      setInterval(function () { self.pollSync(); }, 3000);
    },
    pollSync() {
      var self = this;
      Api.getSyncVersion().then(function (v) {
        if (v !== self._ver) {
          self._ver = v;
          self.loadImages();
          if (self.mode === "aggregate") self.reloadGroups();
          Api.listFolders().then(function (f) { self.folders = f; });
        }
      });
    },
    allTags() { return this.tags; },
    fmtSize: App.fmtSize,
    loadImages() {
      this.loading = true;
      var self = this;
      Api.listImages({ folderId: this.currentFolder || null, tag: this.selectedTag, q: this.q, sort: this.sort })
        .then(function (list) {
          if (self.sort === "time") list.sort((a, b) => (b.id || 0) - (a.id || 0));
          else if (self.sort === "ai") list.sort((a, b) => (b.aiRating || 0) - (a.aiRating || 0));
          else if (self.sort === "manual") list.sort((a, b) => (b.rating || 0) - (a.rating || 0));
          // 初始化卡片状态；默认源：有原生优先原生，否则反推
          list.forEach(function (im) {
            im._exp = false;
            im._src = (im.prompt && im.prompt !== "") ? "origin" : "reverse";
            im._aiParse = false; im._rParse = false; im._wantSrc = ""; im._pErr = ""; im._mErr = "";
          });
          self.images = list;
          self.summary = "共 " + list.length + " 张";
          self.loading = false;
          // 从详情页返回：先不可见，等 Alpine 渲染出完整布局（双 rAF）再定位并一次性显示
          if (self._restoreScroll) {
            var y = self._restoreScroll;
            self._restoreScroll = 0;
            (function pin() {
              requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                  window.scrollTo(0, y);
                  window.scrollTo(0, Math.min(y, document.documentElement.scrollHeight - window.innerHeight));
                  document.documentElement.classList.remove("am-restore");
                });
              });
            })();
          }
        });
    },
    reloadGroups() {
      var self = this;
      Api.aggregateByPrompt({ kind: "exact" }).then(function (g) {
        g.forEach(function (x) {
          x._open = false;
          x.members.sort(function (a, b) {
            return ((b.aiRating || 0) - (a.aiRating || 0)) || ((b.id || 0) - (a.id || 0));
          });
        });
        g.sort(function (a, b) {
          return ((b.maxScore || 0) - (a.maxScore || 0)) ||
                 (((b.members[0] && b.members[0].id) || 0) - ((a.members[0] && a.members[0].id) || 0));
        });
        self.groups = g;
        self.groupCount = g.length;
        self.summary = "共 " + g.length + " 组提示词";
      });
    },
    visibleGroups() {
      if (!this.q) return this.groups;
      var q = this.q.toLowerCase();
      return this.groups.filter(g => g.title.toLowerCase().indexOf(q) >= 0);
    },
    mark(text) { return App.highlight(text, this.q ? [this.q] : []); },
    download(im) {
      var a = document.createElement("a");
      a.href = "api/images/" + im.id + "/file";
      a.download = im.name || "image.png"; a.click();
    },
    copyImage(im) {
      fetch("api/images/" + im.id + "/file").then(r => r.blob()).then(function (b) {
        if (!navigator.clipboard || typeof ClipboardItem === "undefined" || window.isSecureContext === false) {
          throw new Error("unsupported");
        }
        return navigator.clipboard.write([new ClipboardItem({ "image/png": b })]);
      }).then(function () {
        App.toast("已复制");
      }).catch(function () {
        App.toast("复制失败（当前环境不支持复制图片）");
      });
    },
    reqDelete(im) { this.delTarget = im; },
    confirmDelete() {
      var self = this;
      var im = this.delTarget;
      if (!im) return;
      this.delTarget = null;
      Api.deleteImage(im.id).then(function () {
        self.images = self.images.filter(function (x) { return x.id !== im.id; });
      }).catch(function (e) {
        alert((e && e.message) || "删除失败");
      });
    },
    // 图库卡片「模型」块：仅主模型 + LoRA（不含 VAE）
    modelChips(im) {
      return (im && im.tags || []).filter(function (t) {
        return t.category === "model" || t.category === "lora";
      });
    },
    isReparsing(im) { return !!(im && im._aiParse); },
    // 任一处 AI 触发：同时解析模型与提示词（模型/提示词两按钮共享高亮）
    reparseAll(im) {
      var self = this;
      if (im._aiParse) return;
      im._aiParse = true; im._mErr = ""; im._pErr = "";
      Api.reparseModels(im.id).then(function (card) {
        im._aiParse = false;
        if (card && card.tags) im.tags = card.tags;
        if (card && card.model) im.model = card.model;
        if (card && (card.aiPrompt !== undefined || card.aiNegative !== undefined)) {
          im.aiPrompt = card.aiPrompt || "";
          im.aiNegative = card.aiNegative || "";
          im.aiPrompts = (Array.isArray(card.aiPrompts) && card.aiPrompts.length) ? card.aiPrompts : ((im.aiPrompt) ? [im.aiPrompt] : []);
        }
        if (im._wantSrc === "ai") { im._wantSrc = ""; im._src = "ai"; }
      }).catch(function (e) {
        im._aiParse = false;
        im._mErr = e && e.message ? e.message : "AI 解析失败";
        im._pErr = im._mErr;
      });
    },
    modelAIGrey() { return !this._aiParse; },
    // 提示词三种来源是否有内容
    promptGrey(im, kind) {
      if (kind === "origin") return !(im.prompt || "");
      if (kind === "reverse") return !(im.reversePrompt || "");
      if (kind === "ai") return !(im.aiPrompt || "");
      return false;
    },
    selectPrompt(im, kind) {
      if (!this.promptGrey(im, kind)) { im._src = kind; return; }
      if (kind === "reverse") { this.reverseGen(im); }
      else if (kind === "ai") { im._wantSrc = "ai"; this.reparseAll(im); }
      // origin 无内容不可生成，静默
    },
    reverseGen(im) {
      var self = this;
      if (im._rParse) return;
      im._rParse = true; im._pErr = "";
      Api.reversePrompt(im.id).then(function (d) {
        im._rParse = false;
        if (d && d.reversePrompt) im.reversePrompt = d.reversePrompt;
        im._src = "reverse";
      }).catch(function (e) {
        im._rParse = false;
        im._pErr = e && e.message ? e.message : "AI 反推失败";
      });
    },
    promptErr(im) { return (im && im._pErr) || ""; },
    promptMore(im) {
      var t = this.activePrompt(im) || "";
      return t.length > 80 || (t.match(/\n/g) || []).length > 2 || this.activePrompts(im).length > 1;
    },
    // 当前选中提示词源的提示词列表（内容多者在上；多条时忽略 <10 字符的短文本）
    activePrompts(im) {
      var raw;
      if (im._src === "reverse") raw = (im.reversePrompt || "") ? [im.reversePrompt] : [];
      else if (im._src === "ai") raw = (Array.isArray(im.aiPrompts) && im.aiPrompts.length) ? im.aiPrompts.slice() : ((im.aiPrompt || "") ? [im.aiPrompt] : []);
      else raw = (Array.isArray(im.originPrompts) && im.originPrompts.length) ? im.originPrompts.slice() : ((im.prompt || "") ? [im.prompt] : []);
      return this.decoratePrompts(raw);
    },
    decoratePrompts(list) {
      // 隐藏字符数 < 10 的短提示词；按内容多者优先排序
      list = list.filter(function (t) { return (t || "").length >= 10; });
      list.sort(function (a, b) { return b.length - a.length; });
      return list;
    },
    // 当前选中提示词源的实际文本（拼接）
    activePrompt(im) { return this.activePrompts(im).join("\n"); },
    imported(ev) {
      this._import([].slice.call(ev.target.files || []));
      ev.target.value = "";
    },
    drop(ev) {
      var files = [].slice.call((ev.dataTransfer && ev.dataTransfer.files) || []);
      if (files.length) this._import(files);
    },
    _import(files) {
      files = files.filter(function (f) { return f && (!f.type || f.type.indexOf("image/") === 0); });
      if (!files.length) return;
      var ids = window.Mock.getImages().map(i => i.id);
      var next = ids.length ? Math.max.apply(null, ids) + 1 : 1;
      files.forEach(function (f) {
        window.Mock.getImages().push({
          id: next++, folderId: null, name: f.webkitRelativePath || f.name || "image.png",
          width: 0, height: 0, fileSize: f.size || 0, rating: null, aiRating: null, prompt: "", negative: "",
          tags: [], params: {}, reversePrompt: "", thumb: URL.createObjectURL(f),
        });
      });
      this.loadImages();
    },
    copy(text) { App.copyText(text); },
    previewWorkflow(im) {
      var self = this;
      Api.getImage(im.id).then(function (d) {
        if (d && d.workflow) {
          try { self.wfText = JSON.stringify(JSON.parse(d.workflow), null, 2); }
          catch (e) { self.wfText = d.workflow; }
        } else {
          self.wfText = JSON.stringify({ title: im.name, prompt: im.prompt, tags: im.tags }, null, 2);
        }
        self.showWorkflow = true;
      });
    },
    workflowJSON() { return this.wfText || "{}"; },
    exportWorkflow() {
      var blob = new Blob([this.workflowJSON()], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "workflow.json"; a.click();
    },
    open(id) {
      // 记录视图状态与滚动位置，返回时恢复
      try {
        sessionStorage.setItem("am_gallery_state", JSON.stringify({
          scroll: window.scrollY, mode: this.mode, folder: this.currentFolder,
          sort: this.sort, q: this.q, tag: this.selectedTag
        }));
      } catch (e) {}
      location.href = "image.html?id=" + id;
    },
  };
</script>
