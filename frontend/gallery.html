<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图库 · 画镜 ArtMirror</title>
  <link rel="stylesheet" href="style.css" />
  <script src="mock-data.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div x-data="Gallery" x-init="init()">
  <!-- 顶部整体固定（满宽紧贴顶） -->
  <div class="sticky-head">
    <div id="topnav"></div>
    <div class="sticky-inner">
      <div class="toolbar">
      <button class="btn primary" @click="$refs.fileInput.click()">导入</button>
      <input type="file" webkitdirectory multiple style="display:none" x-ref="fileInput" @change="imported($event)" />

      <select x-model="currentFolder" @change="loadImages()" style="width:auto;max-width:220px">
        <option value="">全部目录</option>
        <template x-for="f in folders" :key="f.id">
          <option :value="f.id" x-text="(f.path||'根目录')+' ('+f.count+')'"></option>
        </template>
      </select>

      <div class="seg">
        <button :class="{active:mode==='flat'}" @click="mode='flat';loadImages()">平铺</button>
        <button :class="{active:mode==='immersive'}" @click="mode='immersive';loadImages()">沉浸</button>
        <button :class="{active:mode==='aggregate'}" @click="mode='aggregate';reloadGroups()">聚合</button>
      </div>

      <select x-model="sort" @change="loadImages()" style="width:auto">
        <option value="time">按时间</option>
        <option value="ai">按 AI 评分</option>
        <option value="manual">按人工评分</option>
      </select>

      <span class="nav-spacer"></span>

      <div class="searchbox">
        <input type="text" placeholder="搜索提示词 / 模型…" x-model="q"
               @keyup.debounce.300ms="loadImages()" />
      </div>
      <span class="muted" x-text="summary"></span>
    </div>

    <!-- 标签筛选 -->
    <div class="chips" x-show="allTags.length" style="margin-bottom:0">
      <span style="color:var(--text-3);font-size:12px">筛选：</span>
      <template x-for="t in allTags" :key="t.category+':'+t.name">
        <span class="chip" :class="[t.category, {active: selectedTag===t.name}]"
              @click="selectedTag = selectedTag===t.name ? null : t.name; loadImages()"
              x-text="t.name"></span>
      </template>
      <span class="chip" :class="{active: selectedTag===null}" @click="selectedTag=null;loadImages()">全部</span>
    </div>
    </div>
  </div>

  <div class="page" @dragover.prevent @drop.prevent="drop($event)">
    <div style="margin-top:12px">
    <div x-show="!loading && !images.length && (mode==='flat'||mode==='immersive')" class="empty">
      暂无图片 —— 点击左上角「导入」或前往「设置」配置图片目录。
    </div>

    <!-- 平铺：图片 + 提示词 -->
    <div class="masonry" x-show="mode==='flat' && images.length">
      <template x-for="im in images" :key="im.id">
        <div class="card img-card">
          <div class="thumb-wrap" @click="open(im.id)">
            <img :src="im.thumb" :alt="im.name" loading="lazy" />
          </div>
          <div class="info">
            <div class="meta-row">
              <span class="chip reverse" style="border:none;background:#f3e8ff;color:#833ab4;padding:1px 8px" x-show="im.reversePrompt">反推</span>
              <span class="muted" style="font-size:12px;color:var(--text-3)" x-show="im.prompt&&!im.reversePrompt">原生</span>
              <span style="font-size:12px;color:var(--text-2);font-weight:600" x-show="im.aiRating!=null">AI <span x-text="im.aiRating"></span></span>
              <span class="nav-spacer"></span>
              <button class="icon-btn" title="下载" @click.stop="download(im)">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
              </button>
            </div>
            <div class="muted" style="font-size:11px;margin-top:4px" x-text="im.width+'×'+im.height + ' · ' + fmtSize(im.fileSize)"></div>
            <div class="chips" x-show="im.tags.length" style="margin-top:8px">
              <template x-for="t in im.tags" :key="t.category+t.name">
                <span class="chip" :class="t.category" x-text="t.name"></span>
              </template>
            </div>
            <div style="margin-top:8px" x-show="im.prompt">
              <div class="prompt-header">
                <span style="font-size:12px;color:var(--text-3)">提示词</span>
                <span style="display:inline-flex;align-items:center;gap:2px">
                  <button class="icon-btn" title="展开/收起" x-show="im._hasMore"
                          @click.stop="im._exp=!im._exp">
                    <svg x-show="!im._exp" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg>
                    <svg x-show="im._exp" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14l-5-5-5 5"/></svg>
                  </button>
                  <button class="icon-btn" title="复制提示词" @click.stop="copy(im.prompt)">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                  </button>
                  <button class="icon-btn" title="预览工作流" @click.stop="previewWorkflow(im)">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M5 12l4-4M5 12l4 4M19 12l-4-4M19 12l-4 4"/></svg>
                  </button>
                </span>
              </div>
              <div class="prompt-box" :class="{expanded:im._exp}"
                   x-ref="pb" :id="'pb-'+im.id"
                   @click="im._exp=!im._exp">
                <span x-html="mark(im.prompt || '（无原生提示词）')"></span>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- 沉浸：纯图片，保留原始宽高比 -->
    <div class="masonry immersive" x-show="mode==='immersive' && images.length">
      <template x-for="im in images" :key="im.id">
        <div class="card img-card immersive-cell" @click="open(im.id)" title="点击查看详情">
          <div class="thumb-wrap"><img :src="im.thumb" :alt="im.name" loading="lazy" /></div>
        </div>
      </template>
    </div>

    <!-- 聚合 -->
    <div x-show="mode==='aggregate'" x-cloak>
      <div class="muted mb" style="display:flex;align-items:center;gap:8px">
        按相同提示词聚合：<b x-text="groupCount"></b> 组
      </div>
      <div class="group-grid" x-show="visibleGroups().length">
        <template x-for="g in visibleGroups()" :key="g.id">
          <div class="card group-card">
            <div class="cover-row">
              <template x-for="m in g.members.slice(0,6)" :key="m.id">
                <img :src="m.thumb" @click="open(m.id)" :title="m.name" />
              </template>
            </div>
            <div class="g-title">
              <h4><span x-html="mark(g.title)"></span></h4>
            </div>
            <div class="g-body">
              <div class="muted" style="display:flex;justify-content:space-between;font-size:12px">
                <span x-text="g.count+' 张图片'"></span>
                <span x-text="'最高 AI '+g.maxScore"></span>
              </div>
              <button class="btn sm mt" @click="g._open=!g._open" x-text="g._open?'收起':'展开成员'"></button>
              <div class="member-grid" x-show="g._open">
                <template x-for="m in g.members" :key="m.id">
                  <div>
                    <img :src="m.thumb" @click="open(m.id)" :title="m.name" />
                    <div style="text-align:center;font-size:11px;color:var(--text-3)" x-text="m.aiRating!=null?'AI '+m.aiRating:'未评分'"></div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
      <div class="empty" x-show="!visibleGroups().length">没有符合条件的提示词组。</div>
    </div>
  </div>

  <!-- 工作流预览弹窗 -->
  <div class="modal-mask" x-show="showWorkflow" @keydown.escape.window="showWorkflow=false">
    <div class="modal">
      <div class="modal-head">
        <h3>工作流预览</h3>
        <button class="modal-x" @click="showWorkflow=false">&times;</button>
      </div>
      <div class="modal-body">
        <div class="btn-row mb">
          <button class="btn sm" @click="copy(workflowJSON())">复制 JSON</button>
          <button class="btn sm" @click="exportWorkflow()">导出 .json</button>
        </div>
        <pre class="code" x-text="workflowJSON()"></pre>
      </div>
    </div>
  </div>
</div>
</div>

<script>
  window.Gallery = {
    folders: [], images: [], groups: [], tags: [], q: "", mode: "flat", currentFolder: "",
    selectedTag: null, sort: "time", loading: true, summary: "", showWorkflow: false, wfText: "",
    _ver: -1,
    init() {
      App.initNav("gallery");
      var self = this;
      Api.listFolders().then(f => { self.folders = f; });
      Api.listTags().then(t => { self.tags = t; });
      this.loadImages();
      setInterval(function () { self.pollSync(); }, 3000);
    },
    pollSync() {
      var self = this;
      Api.getSyncVersion().then(function (v) {
        if (v !== self._ver) {
          self._ver = v;
          self.loadImages();
          if (self.mode === "aggregate") self.reloadGroups();
          Api.listFolders().then(function (f) { self.folders = f; });
        }
      });
    },
    allTags() { return this.tags; },
    fmtSize: App.fmtSize,
    loadImages() {
      this.loading = true;
      var self = this;
      Api.listImages({ folderId: this.currentFolder || null, tag: this.selectedTag, q: this.q, sort: this.sort })
        .then(function (list) {
          if (self.sort === "time") list.sort((a, b) => (b.id || 0) - (a.id || 0));
          else if (self.sort === "ai") list.sort((a, b) => (b.aiRating || 0) - (a.aiRating || 0));
          else if (self.sort === "manual") list.sort((a, b) => (b.rating || 0) - (a.rating || 0));
          // 检查提示词是否可折叠
          list.forEach(function (im) {
            im._hasMore = (im.prompt || "").length > 80 || ((im.prompt || "").match(/\n/g) || []).length > 1;
            im._exp = false;
          });
          self.images = list;
          self.summary = "共 " + list.length + " 张";
          self.loading = false;
        });
    },
    reloadGroups() {
      var self = this;
      Api.aggregateByPrompt({ kind: "exact" }).then(function (g) {
        g.forEach(function (x) {
          x._open = false;
          x.members.sort(function (a, b) {
            return ((b.aiRating || 0) - (a.aiRating || 0)) || ((b.id || 0) - (a.id || 0));
          });
        });
        g.sort(function (a, b) {
          return ((b.maxScore || 0) - (a.maxScore || 0)) ||
                 (((b.members[0] && b.members[0].id) || 0) - ((a.members[0] && a.members[0].id) || 0));
        });
        self.groups = g;
        self.groupCount = g.length;
        self.summary = "共 " + g.length + " 组提示词";
      });
    },
    visibleGroups() {
      if (!this.q) return this.groups;
      var q = this.q.toLowerCase();
      return this.groups.filter(g => g.title.toLowerCase().indexOf(q) >= 0);
    },
    mark(text) { return App.highlight(text, this.q ? [this.q] : []); },
    download(im) {
      fetch(im.thumb).then(r => r.blob()).then(function (b) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(b); a.download = im.name || "image.png"; a.click();
      }).catch(function () {
        var a = document.createElement("a"); a.href = im.thumb; a.download = im.name || "image.png"; a.click();
      });
    },
    imported(ev) {
      this._import([].slice.call(ev.target.files || []));
      ev.target.value = "";
    },
    drop(ev) {
      var files = [].slice.call((ev.dataTransfer && ev.dataTransfer.files) || []);
      if (files.length) this._import(files);
    },
    _import(files) {
      files = files.filter(function (f) { return f && (!f.type || f.type.indexOf("image/") === 0); });
      if (!files.length) return;
      var ids = window.Mock.getImages().map(i => i.id);
      var next = ids.length ? Math.max.apply(null, ids) + 1 : 1;
      files.forEach(function (f) {
        window.Mock.getImages().push({
          id: next++, folderId: null, name: f.webkitRelativePath || f.name || "image.png",
          width: 0, height: 0, fileSize: f.size || 0, rating: null, aiRating: null, prompt: "", negative: "",
          tags: [], params: {}, reversePrompt: "", thumb: URL.createObjectURL(f),
        });
      });
      this.loadImages();
    },
    copy(text) { if (navigator.clipboard) navigator.clipboard.writeText(text || ""); },
    previewWorkflow(im) {
      var self = this;
      Api.getImage(im.id).then(function (d) {
        if (d && d.workflow) {
          try { self.wfText = JSON.stringify(JSON.parse(d.workflow), null, 2); }
          catch (e) { self.wfText = d.workflow; }
        } else {
          self.wfText = JSON.stringify({ title: im.name, prompt: im.prompt, tags: im.tags }, null, 2);
        }
        self.showWorkflow = true;
      });
    },
    workflowJSON() { return this.wfText || "{}"; },
    exportWorkflow() {
      var blob = new Blob([this.workflowJSON()], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "workflow.json"; a.click();
    },
    open(id) { location.href = "image.html?id=" + id; },
  };
</script>
</body>
</html>
